name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

  # This SDK talks to a router and nothing else. A third-party require has
  # to be a deliberate decision, so it fails here instead of arriving by
  # accident through a "helpful" upgrade.
  dependency-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Only oekit modules are allowed
        run: make zero-dep

      - name: go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  # The service layer is generated. Regenerating must be a no-op, otherwise
  # the checked-in code and the contract tables have drifted.
  generated-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Regenerate and diff
        run: |
          go run ./codegen
          gofmt -w service/
          git diff --exit-code -- service/
